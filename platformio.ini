; Fingertype 固件 —— XIAO ESP32S3 + 海凌科 HLK-ZW101/ZW111 指纹模块
; 编译：pio run        刷写：pio run -t upload        看日志：pio device monitor

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; 编译前把 web/index.html 嵌入固件（配置盘里的 Settings.html）
extra_scripts = pre:scripts/embed_web.py

; 平时靠蓝牙（BLE）键盘输入密码，Type-C 只供电。
; 插上数据线时，同一个 Type-C 口同时是：
;   1. USB 键盘（HID）——蓝牙不可用时的备用输出
;   2. USB 串口（CDC）——网页配置工具通过它和设备通信
; USB 在 setup() 里手动启动，这样能先设置“允许唤醒电脑”等属性
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    ; 框架自带的 USB 库里有 U 盘相关文件会引用 FS.h，这里补上它的路径
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    FS
    h2zero/NimBLE-Arduino@^2.3.0
